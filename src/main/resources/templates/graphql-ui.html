<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GraphQL UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">← Retour à l'application</a>
    </div>
</nav>

<div class="container mt-4">
    <h1 class="mb-4">GraphQL Playground</h1>
    <div class="row">
        <div class="col-md-6">
            <h3>Requête</h3>
            <textarea id="queryEditor" class="form-control font-monospace" rows="15">
query {
    getAllBooks {
        id
        title
        author
        price
        category
    }
}
            </textarea>
            <button class="btn btn-primary mt-3" onclick="executeQuery()">Exécuter</button>
        </div>
        <div class="col-md-6">
            <h3>Résultat</h3>
            <pre id="result" class="bg-light p-3 border rounded" style="height: 400px; overflow: auto;"></pre>
        </div>
    </div>
</div>

<script>
    async function executeQuery() {
        const query = document.getElementById('queryEditor').value;
        try {
            const response = await fetch('/graphql', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: query })
            });
            const result = await response.json();
            document.getElementById('result').textContent = JSON.stringify(result, null, 2);
        } catch (error) {
            document.getElementById('result').textContent = 'Erreur : ' + error.message;
        }
    }
</script>
</body>
</html>
